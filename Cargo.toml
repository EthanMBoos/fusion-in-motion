[workspace]
members = ["crates/fusion", "crates/fusion-schema"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ethanboos/fusion-in-motion"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
mcap = "0.25"
nalgebra = "0.35"
prost = "0.14"
rerun = { version = "0.36", default-features = false, features = ["sdk"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3.23"
