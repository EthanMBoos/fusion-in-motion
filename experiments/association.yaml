# Object association experiment
#
# Question: Can the tracker keep two tracks separate when detections have no IDs?
# The objects pass within one meter around 5 seconds. Scrub from 4 to 6 seconds.
# Watch whether track-001 and track-002 continue on the same paths after crossing.

root_seed: 20260823

world:
  objects:
    - id: northbound
      initial_position_m: { x: 7.5, y: -4.0 }
      velocity_world_mps: { x: 0.0, y: 0.8 }
    - id: southbound
      initial_position_m: { x: 8.5, y: 4.0 }
      velocity_world_mps: { x: 0.0, y: -0.8 }

trajectory:
  - { id: watch-crossing, duration_s: 10.0, longitudinal_acceleration_mps2: 0.0, yaw_rate_radps: 0.0 }

imu:
  enabled: true
  rate_hz: 100.0
  gyro_white_noise_density_radps_sqrt_hz: 0.0008
  accel_white_noise_density_mps2_sqrt_hz: 0.012

gps:
  enabled: true
  rate_hz: 2.0
  horizontal_position_stddev_m: 0.25

camera:
  enabled: true
  rate_hz: 10.0
  horizontal_fov_rad: 2.8
  max_range_m: 25.0
  bearing_noise_stddev_rad: 0.006
  # Lower this and the lidar probability to create missed detections.
  detection_probability: 0.9

lidar:
  enabled: true
  rate_hz: 5.0
  horizontal_fov_rad: 6.283185307179586
  max_range_m: 25.0
  range_noise_stddev_m: 0.025
  bearing_noise_stddev_rad: 0.002
  detection_probability: 0.8

object_tracker:
  acceleration_noise_stddev_mps2: 0.5
  # Lower the gate to reject more pairings; raise it to allow distant pairings.
  gate_sigma: 4.0
  # These control when a new track appears and when a missing track is removed.
  confirmation_hits: 2
  max_missed_lidar_scans: 3
