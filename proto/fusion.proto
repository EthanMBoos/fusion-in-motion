syntax = "proto3";

package fusion;

enum StampReference {
  STAMP_REFERENCE_UNSPECIFIED = 0;
  STAMP_REFERENCE_START = 1;
  STAMP_REFERENCE_MIDPOINT = 2;
  STAMP_REFERENCE_END = 3;
  STAMP_REFERENCE_TRIGGER = 4;
  STAMP_REFERENCE_UNKNOWN = 5;
}

enum EstimateStatus {
  ESTIMATE_STATUS_UNSPECIFIED = 0;
  ESTIMATE_STATUS_INITIALIZING = 1;
  ESTIMATE_STATUS_VALID = 2;
  ESTIMATE_STATUS_DIVERGED = 3;
}

enum CovarianceKind {
  COVARIANCE_KIND_UNSPECIFIED = 0;
  COVARIANCE_KIND_UNKNOWN = 1;
  COVARIANCE_KIND_FULL = 2;
}

message Vec3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Quaternion {
  // Active rotation in xyzw serialization order.
  double x = 1;
  double y = 2;
  double z = 3;
  double w = 4;
}

message Pose {
  Vec3 position = 1;
  Quaternion orientation_xyzw = 2;
  string parent_frame = 3;
  string child_frame = 4;
}

message RecordHeader {
  uint32 format_version = 1;
  reserved 2;
  string run_id = 3;
  string record_id = 4;
  string sensor_instance_id = 5;
  sint64 reported_stamp_ns = 6;
  StampReference stamp_reference = 7;
  sint64 acquisition_duration_ns = 8;
  sint64 receipt_time_ns = 9;
  uint64 sensor_sequence = 10;
  uint64 delivery_index = 11;
  bool valid = 12;
  repeated string quality_flags = 13;
}

message ImuSample {
  RecordHeader header = 1;
  Vec3 angular_rate_radps = 2;
  Vec3 specific_force_mps2 = 3;
}

message Landmark {
  string id = 1;
  Vec3 position_world_m = 2;
}

message LandmarkMap {
  RecordHeader header = 1;
  string frame_id = 2;
  repeated Landmark landmarks = 3;
}

message CameraFeature {
  string landmark_id = 1;
  double azimuth_rad = 2;
  double elevation_rad = 3;
}

message CameraFrame {
  RecordHeader header = 1;
  repeated CameraFeature features = 2;
  string association_mode = 3;
}

message LidarReturn {
  string landmark_id = 1;
  double range_m = 2;
  double azimuth_rad = 3;
  sint64 acquisition_offset_ns = 4;
}

message LidarScan {
  RecordHeader header = 1;
  repeated LidarReturn returns = 2;
  string association_mode = 3;
}

message TruthState {
  sint64 truth_time_ns = 1;
  Pose pose_w_b = 2;
  Vec3 velocity_world_mps = 3;
  Vec3 acceleration_world_mps2 = 4;
  Vec3 angular_velocity_body_radps = 5;
  double forward_speed_mps = 6;
  double path_distance_m = 7;
}

message ImuEffectsTruth {
  Vec3 gyro_bias_body_radps = 1;
  Vec3 accel_bias_body_mps2 = 2;
}

message ObservationTruth {
  string visible_record_id = 1;
  sint64 acquisition_start_truth_ns = 2;
  sint64 acquisition_end_truth_ns = 3;
  sint64 publish_truth_ns = 4;
  sint64 arrival_truth_ns = 5;
  reserved 6;
  oneof ideal_observation {
    ImuSample ideal_imu = 10;
    CameraFrame ideal_camera = 11;
    LidarScan ideal_lidar = 12;
  }
  ImuEffectsTruth imu_effects = 13;
}

message StateEstimate {
  string estimator_id = 1;
  sint64 estimate_time_ns = 2;
  sint64 emission_time_ns = 3;
  Pose pose_w_b = 4;
  Vec3 velocity_world_mps = 5;
  EstimateStatus status = 6;
  CovarianceKind covariance_kind = 7;
  // Row-major covariance for [x, y, yaw, forward_speed, gyro_bias_z, accel_bias_x].
  repeated double covariance = 8;
  uint64 revision = 9;
  optional double gyro_bias_z_radps = 10;
  optional double accel_bias_x_mps2 = 11;
}
