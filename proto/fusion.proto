syntax = "proto3";

package fusion;

message Vec2 {
  double x = 1;
  double y = 2;
}

message Pose2 {
  Vec2 position = 1;
  double yaw_rad = 2;
}

message MeasurementTime {
  sint64 measurement_time_ns = 1;
  sint64 arrival_time_ns = 2;
}

message ImuSample {
  MeasurementTime time = 1;
  double yaw_rate_radps = 2;
  double forward_acceleration_mps2 = 3;
}

message GpsFix {
  MeasurementTime time = 1;
  Vec2 position_world_m = 2;
  double horizontal_position_variance_m2 = 3;
}

message CameraDetection {
  double bearing_rad = 1;
  double bearing_variance_rad2 = 2;
}

message CameraFrame {
  MeasurementTime time = 1;
  repeated CameraDetection detections = 2;
}

message LidarDetection {
  sint64 measurement_time_ns = 1;
  double range_m = 2;
  double bearing_rad = 3;
  double range_variance_m2 = 4;
  double bearing_variance_rad2 = 5;
}

message LidarScan {
  MeasurementTime time = 1;
  repeated LidarDetection detections = 2;
}

message EgoTruthState {
  sint64 time_ns = 1;
  Pose2 pose_world = 2;
  double forward_speed_mps = 3;
}

message ObjectTruthState {
  string track_key = 1;
  sint64 time_ns = 2;
  Vec2 position_world_m = 3;
  Vec2 velocity_world_mps = 4;
}

message ImuBiasTruth {
  sint64 time_ns = 1;
  double gyro_bias_z_radps = 2;
  double accel_bias_x_mps2 = 3;
}

message EgoStateEstimate {
  sint64 estimate_time_ns = 1;
  sint64 available_time_ns = 2;
  Pose2 pose_world = 3;
  double forward_speed_mps = 4;
  repeated double state_covariance = 5;
  optional double gyro_bias_z_radps = 6;
  optional double accel_bias_x_mps2 = 7;
}

message ObjectTrack {
  string track_id = 1;
  sint64 estimate_time_ns = 2;
  sint64 available_time_ns = 3;
  Vec2 position_world_m = 4;
  Vec2 velocity_world_mps = 5;
  repeated double state_covariance = 6;
}
