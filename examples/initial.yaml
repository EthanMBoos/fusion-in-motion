  accel_turn_on_bias_mps2: { x: 0.025, y: 0.0, z: 0.0 }
  gyro_bias_random_walk_radps_sqrt_s: 0.00002
  accel_bias_random_walk_mps2_sqrt_s: 0.0005
  gyro_saturation_radps: 8.0
  accel_saturation_mps2: 80.0
