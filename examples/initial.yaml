format_version: 1
run_id: initial-gps-imu-object-tracking
duration_s: 16.0
motion_speed_factor: 1.0
local_epoch: synthetic-enu
root_seed: 20260823

platform:
  model: planar_ground
  body_frame: body
  world_frame: world_enu

world:
  objects:
    - id: stationary
      association_key: stationary
      initial_position_m: { x: 8.0, y: 4.0, z: 0.0 }
      velocity_world_mps: { x: 0.0, y: 0.0, z: 0.0 }
    - id: moving
      association_key: moving
      initial_position_m: { x: 5.0, y: -3.0, z: 0.0 }
      velocity_world_mps: { x: 0.15, y: 0.35, z: 0.0 }

trajectory:
  - { id: initial-rest, duration_s: 1.0, longitudinal_acceleration_mps2: 0.0, yaw_rate_radps: 0.0 }
  - { id: accelerate, duration_s: 2.0, longitudinal_acceleration_mps2: 0.5, yaw_rate_radps: 0.0 }
  - { id: straight, duration_s: 2.0, longitudinal_acceleration_mps2: 0.0, yaw_rate_radps: 0.0 }
  - { id: left-turn, duration_s: 2.0, longitudinal_acceleration_mps2: 0.0, yaw_rate_radps: 0.5 }
  - { id: post-turn, duration_s: 1.0, longitudinal_acceleration_mps2: 0.0, yaw_rate_radps: 0.0 }
  - { id: decelerate, duration_s: 2.0, longitudinal_acceleration_mps2: -0.5, yaw_rate_radps: 0.0 }
  - { id: stopped, duration_s: 1.0, longitudinal_acceleration_mps2: 0.0, yaw_rate_radps: 0.0 }
  - { id: restart, duration_s: 1.0, longitudinal_acceleration_mps2: 0.5, yaw_rate_radps: 0.0 }
  - { id: right-turn, duration_s: 2.0, longitudinal_acceleration_mps2: 0.0, yaw_rate_radps: -0.5 }
  - { id: final-deceleration, duration_s: 1.0, longitudinal_acceleration_mps2: -0.5, yaw_rate_radps: 0.0 }
  - { id: final-rest, duration_s: 1.0, longitudinal_acceleration_mps2: 0.0, yaw_rate_radps: 0.0 }

imu:
